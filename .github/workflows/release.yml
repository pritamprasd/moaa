name: Build, Test & Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-test-release:
    name: Build, Test & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Prepare Release Assets
        id: prep_assets
        run: |
          mkdir -p release-artifacts
          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="0.1.0"
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RUN_NUM="${{ github.run_number }}"
          TAG_NAME="v${VERSION_NAME}-r${RUN_NUM}"
          RELEASE_TITLE="Release v${VERSION_NAME} (Build #${RUN_NUM})"

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT

          # Copy and standardize APK names
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/MotherOfAllApps-${TAG_NAME}-debug.apk
          fi

          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/MotherOfAllApps-${TAG_NAME}-release-unsigned.apk
          fi

      - name: Upload Build Artifacts to Run
        uses: actions/upload-artifact@v4
        with:
          name: mother-of-all-apps-apks
          path: release-artifacts/*
          retention-days: 14

      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep_assets.outputs.tag_name }}
          name: ${{ steps.prep_assets.outputs.release_title }}
          body: |
            ## 🚀 MotherOfAllApps Release `${{ steps.prep_assets.outputs.tag_name }}`

            Automated build & release generated from commit [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) pushed to `main`.

            ### 📦 Included APK Binaries
            - **Debug APK (Installable Immediately)**: `MotherOfAllApps-${{ steps.prep_assets.outputs.tag_name }}-debug.apk`
            - **Release APK (Unsigned)**: `MotherOfAllApps-${{ steps.prep_assets.outputs.tag_name }}-release-unsigned.apk`

            ### 📋 Quality & Verification Summary
            - ✅ Unit Tests: **Passed** (`./gradlew testDebugUnitTest`)
            - 🛠️ Gradle Build: **Successful** (`./gradlew assembleDebug assembleRelease`)
            - 🏷️ Version: `${{ steps.prep_assets.outputs.version_name }}`
          files: |
            release-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
